name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version as a private GitHub desktop release
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: desktop-packages
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-desktop.txt
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: python -m unittest discover -s tests -v
      - name: Check actual installer success and automatic rollback with isolated apps
        run: python scripts/check-installer.py
      - if: runner.os == 'macOS'
        run: python scripts/build-mac-desktop.py
      - if: runner.os == 'Windows'
        run: python scripts/build-windows-desktop.py
      - name: Test bundled artwork, native narration, actual video, and native app window
        run: python scripts/check-frozen.py
      - run: python scripts/package-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop-dist/*.zip
            desktop-dist/*.sha256
          compression-level: 0
          if-no-files-found: error
  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      - name: Publish verified packages together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('resources/desktop-release.json'))['version'])")
          gh release create "desktop-v$VERSION" packages/* --target "$GITHUB_SHA" --title "StarPower Content Studio $VERSION" --notes-file DESKTOP-RELEASE-NOTES.md --latest
