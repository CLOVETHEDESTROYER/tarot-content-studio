name: Verify Windows and Intel Mac
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Intel macOS architecture and launcher syntax
        if: runner.os == 'macOS'
        run: |
          python -c "import platform; assert platform.machine() == 'x86_64', platform.machine()"
          for script in scripts/setup-mac.sh *.command; do bash -n "$script"; done
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build editor from lockfile
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check complete assets and native FFmpeg
        run: python scripts/doctor.py
      - name: Test calendar, readings, persistence, platform defaults, and API
        run: python -m unittest discover -s tests -v
      - name: Export and fully decode a real video using the native system voice
        run: python scripts/smoke-test.py
